window.go = async (id, bg, yaw = 0, elev = 0.05, ty = 0.525, dist = 2.47, tx = 0) => {
  await document.fonts.load('900 100px "Noto Sans KR"');
  const cv = document.getElementById('cv');

  const ch = Concepts[id](); S.add(ch.root); window.S = S; window.CH = ch; if (window.PROBE) window.PROBE(ch.root);
  S.view(yaw, elev, dist, ty, tx);
  S.render(); S.render();
  window.done = true;
};
